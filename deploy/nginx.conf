# Keep one browser origin for Identity cookies and exact-origin CORS.
server {
  listen 8080;
  server_name www.peaaiiteam8.online;
  return 308 https://peaaiiteam8.online$request_uri;
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
