# Keep one browser origin for Identity cookies and exact-origin CORS.
map $request_method $pipeline_post_key {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $pipeline_post_key zone=pipeline_post:10m rate=6r/m;

server {
  listen 8080;
  server_name www.peaaiiteam8.online;
  return 308 https://peaaiiteam8.online$request_uri;
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/pipeline/ {
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    limit_req zone=pipeline_post burst=3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pipeline_upstream http://pipeline:8787;
    proxy_pass $pipeline_upstream;
  }
}
